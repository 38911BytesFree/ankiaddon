name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests build.py

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is not decoration. Anki has shipped a 3.9 interpreter across
        # several release lines, and syntax like `float | None` in a signature
        # imports fine on 3.13 while crashing on 3.9 — a class of bug that only
        # surfaces when the add-on is loaded by a real user. Ruff's FA rules
        # catch most of it statically; this leg catches the rest.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install pytest
      - run: python -m pytest

      # Import every core module standalone. The test suite only imports what it
      # exercises, so a module-level syntax or annotation error in an untested
      # file would otherwise slip through.
      - name: Import-check core modules
        run: |
          cd src/photo2cards
          for f in core/*.py; do
            m="core.$(basename "$f" .py)"
            [ "$m" = "core.__init__" ] && continue
            [ "$m" = "core.imaging" ] && continue  # needs PyQt6, not installed here
            python -c "import $m" || exit 1
          done

  build:
    name: package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python build.py

      # Guard against ever shipping the user's saved key or stray bytecode.
      - name: Verify archive contents
        run: |
          python - <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile("dist/photo2cards.ankiaddon").namelist()
          bad = [n for n in names
                 if n.endswith(".pyc")
                 or "__pycache__" in n
                 or n.rsplit("/", 1)[-1] == "meta.json"]
          if bad:
              sys.exit("archive contains files that must not ship: " + ", ".join(bad))
          required = {"__init__.py", "manifest.json", "config.json"}
          missing = required - set(names)
          if missing:
              sys.exit("archive is missing required files: " + ", ".join(sorted(missing)))
          print(f"ok - {len(names)} files")
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: photo2cards-ankiaddon
          path: dist/*.ankiaddon
          if-no-files-found: error
